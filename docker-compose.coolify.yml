services:
  mtumishi-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      MTUMISHI_QGIS_RPC_PORT: ${MTUMISHI_QGIS_RPC_PORT:-65534}
      MTUMISHI_WORKER_ID: ${MTUMISHI_WORKER_ID:-mtumishi-worker-coolify-01}
      MTUMISHI_POLL_SECONDS: ${MTUMISHI_POLL_SECONDS:-2}
      MTUMISHI_LEASE_SECONDS: ${MTUMISHI_LEASE_SECONDS:-120}
      MTUMISHI_DEFAULT_RESERVED_UNITS: ${MTUMISHI_DEFAULT_RESERVED_UNITS:-12}
      MTUMISHI_DEFAULT_RUNTIME: ${MTUMISHI_DEFAULT_RUNTIME:-native}
      MTUMISHI_MODEL_NAME: ${MTUMISHI_MODEL_NAME:-gemini-2.5-flash}
      MTUMISHI_WORKSPACES: ${MTUMISHI_WORKSPACES:-.}
      # --- Geospatial RAG (Analog Finder - NASA Space Apps 2026) ---
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      QWEN_VL_ENDPOINT: ${QWEN_VL_ENDPOINT:-}
      MTUMISHI_HTTP_ENABLED: ${MTUMISHI_HTTP_ENABLED:-1}
      MTUMISHI_HTTP_PORT: ${MTUMISHI_HTTP_PORT:-8000}
      # --- Automated Geospatial Ingestion Scheduler ---
      GEOSPATIAL_AUTO_INGEST_ENABLED: ${GEOSPATIAL_AUTO_INGEST_ENABLED:-1}
      GEOSPATIAL_AUTO_INGEST_INTERVAL_MINUTES: ${GEOSPATIAL_AUTO_INGEST_INTERVAL_MINUTES:-360}
      GEOSPATIAL_AUTO_INGEST_BATCH_SIZE: ${GEOSPATIAL_AUTO_INGEST_BATCH_SIZE:-5}
      GEOSPATIAL_AUTO_INGEST_MAX_CLOUDS: ${GEOSPATIAL_AUTO_INGEST_MAX_CLOUDS:-15.0}
      GEOSPATIAL_AUTO_INGEST_TARGET_TOTAL: ${GEOSPATIAL_AUTO_INGEST_TARGET_TOTAL:-500}
      GEOSPATIAL_AUTO_INGEST_REGIONS: ${GEOSPATIAL_AUTO_INGEST_REGIONS:-all}
    ports:
      - "${MTUMISHI_HOST_PORT:-8085}:${MTUMISHI_HTTP_PORT:-8000}"
